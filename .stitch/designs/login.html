<body class="h-screen w-full flex items-center justify-center overflow-hidden bg-background relative font-body-base text-body-base">
<!-- Background Image -->
<div class="absolute inset-0 z-0">
<div class="bg-cover bg-center w-full h-full opacity-30" data-alt="A macro, extremely detailed photograph of a massive server room in a high-tech telecommunications center. Rows of sleek, dark metallic racks stretch into infinity. Countless fiber optic cables glow with intense electric cyan and deep violet light. The atmosphere is cinematic and moody, dominated by shadows and luminous data streams. High contrast, technical, and immersive." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCTIcr2zyV38eu5B-0YBWF0FKbtzzg4-UnQFbCQ5ycxZOu2zYYH6yteTd-HhD4C2FN_6KLgr3TTnw69UQ-JkXftkzAW4Jrbk0zgpBSs9ht-T7bZIO-7XJ8D1fIm7anTXUHFd7FDUJugyvbvPJFZfMsQ8ddGRVAUQaMZFlQzta4yd8XPNHOz1QjCbEX9D02UNywVV9ZKT0DLG0My_oKiPC0kk0TZZPFJ1rFmzchM8uhBcG9x_-nQPGlSEXPI7SffdMAlQMuIqigKRAk')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-background via-background/80 to-transparent"></div>
</div>
<!-- Login Card -->
<div class="relative z-10 w-full max-w-md p-lg bg-surface-container-high rounded-xl border border-outline-variant glow-shadow backdrop-blur-md">
<!-- Logo Header -->
<div class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 rounded-lg bg-surface-variant flex items-center justify-center mb-sm border border-outline-variant"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxBoYf8n-k9m5EQm3TiYnvZMPt7X-en1nCt5g67hU8PsBzYgJ3SOUiIivTIepviyiMEx8WoLCKKdkQ9_3Wq0uTh3-9Nfx3NEXgmlMAgOsfOdfZY6A6RUEf4iJWmUMgr9Th9nJaEJdppaODIdo4VnO7CaOl3q9YwUk1YGEegLtzfU-nrIO2rX_BzGLTKV65B2oNYmLg7HXiEBr4WtwM_xFtjcvSIUtBCAQFnAPjPfTK2fih1cqyf_kL1eSJsHphtnZapLF8f6B_UGI" alt="NMS Logo" class="w-full h-full rounded-lg object-cover"></div>
<h1 class="font-display-lg text-display-lg text-on-surface">NMS</h1>
<p class="font-body-mono text-body-mono text-on-surface-variant mt-xs">Authentication Required</p>
</div>
<!-- Form -->
<form class="space-y-md">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs">Operator ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">person</span>
<input class="w-full bg-white text-surface-container-lowest border-outline focus:border-primary focus:ring-1 focus:ring-primary rounded pl-10 pr-3 py-2 font-body-mono text-body-mono placeholder:text-outline-variant transition-colors" placeholder="e.g. Alpha-7" type="text">
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs">Access Code</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
<input class="w-full bg-white text-surface-container-lowest border-outline focus:border-primary focus:ring-1 focus:ring-primary rounded pl-10 pr-3 py-2 font-body-mono text-body-mono placeholder:text-outline-variant transition-colors" placeholder="••••••••" type="password">
</div>
</div>
<div class="flex items-center justify-between pt-sm">
<label class="flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox">
<div class="w-8 h-4 bg-surface-variant rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-primary relative"></div>
<span class="ml-sm font-body-base text-body-base text-on-surface-variant">Remember Me</span>
</label>
<a class="font-body-mono text-body-mono text-primary hover:text-primary-fixed transition-colors" href="#">Forgot Code?</a>
</div>
<button class="w-full mt-lg bg-primary text-on-primary font-title-sm text-title-sm py-3 rounded-lg hover:bg-primary-fixed transition-colors flex items-center justify-center gap-xs" type="button">
<span class="">Establish Connection</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
<div class="mt-lg pt-md border-t border-outline-variant text-center">
<p class="font-body-mono text-[11px] text-on-surface-variant">System Status: <span class="text-tertiary">Live</span> | Sec-Level: Omega</p>
</div>
</div>
