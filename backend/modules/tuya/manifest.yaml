id: tuya
name: tuyaTitle
version: 1.0.0
description: tuyaSub
enabled_by_default: true
type: driver


deps: []

entrypoints:
  factory: "backend.modules.tuya:create_module"
  router: "backend.modules.tuya.api:get_router"

routes:
  - path: "/tuya"
    name: "tuya-index"
    meta:
      title: "Tuya Devices"
      titleKey: "tuyaTitle"
      icon: "cpu"
      group: "devicesGroup"
      requires_auth: true

menu:
  location: sidebar
  group: "devicesGroup"
  items:
    - path: "/tuya"
      label: "tuyaTitle"
      icon: "cpu"

config_schema:
  type: object
  properties:
    client_id:
      type: string
      default: ""
      title: "tuyaClientId"
      group: "tuyaGroupCloud"
    client_secret:
      type: string
      default: ""
      title: "tuyaClientSecret"
      group: "tuyaGroupCloud"
    region:
      type: string
      default: "eu"
      title: "tuyaRegion"
      enum: ["eu", "us", "cn", "in"]
      group: "tuyaGroupCloud"
    default_mode:
      type: string
      default: "auto"
      title: "tuyaDefaultMode"
      enum: ["auto", "local", "cloud"]
      group: "tuyaGroupControl"
    poll_interval_sec:
      type: integer
      minimum: 5
      maximum: 300
      default: 15
      title: "tuyaPollInterval"
      group: "tuyaGroupControl"

permissions:
  - id: "module.tuya.view"
    name: "permName_module.tuya.view"
    category: "Tuya"
    description: "permDesc_module.tuya.view"
  - id: "module.tuya.edit"
    name: "permName_module.tuya.edit"
    category: "Tuya"
    description: "permDesc_module.tuya.edit"
  - id: "module.tuya.control"
    name: "permName_module.tuya.control"
    category: "Tuya"
    description: "permDesc_module.tuya.control"

widgets:
  - id: "tuya-summary"
    title: "tuyaWidgetTitle"
    description: "tuyaWidgetDesc"
    endpoint: "/api/v1/m/tuya/devices"
    component: "TuyaWidget"
    size: "medium"


