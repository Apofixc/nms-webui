name: Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry --project backend install --no-interaction

      - name: Run Ruff Linter
        run: |
          poetry --project backend run ruff check backend

      - name: Run Pytest
        run: |
          poetry --project backend run python -m pytest backend/tests
